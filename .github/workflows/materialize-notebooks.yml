name: Materialize research notebooks

on:
  workflow_dispatch:
  push:
    paths:
      - 'notebooks/.packed/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode notebooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p notebooks
          shopt -s nullglob
          for f in notebooks/.packed/*.ipynb.gz.b64; do
            out="notebooks/$(basename "${f%.gz.b64}")"
            base64 -d "$f" | gzip -dc > "$out"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("notebooks").glob("0*.ipynb"))
          assert len(files)==6, files
          for p in files:
              nb=json.loads(p.read_text(encoding="utf-8"))
              assert nb.get("nbformat")==4
              assert any(c.get("cell_type")=="code" for c in nb["cells"])
              print("validated",p,len(nb["cells"]))
          PY
      - name: Commit materialized notebooks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb
          git rm -r notebooks/.packed
          if git diff --cached --quiet; then
            echo "No notebook changes"
            exit 0
          fi
          git commit -m "Add reproducible scientific notebooks"
          git push
